const data=JSON.parse(document.querySelector('#data').textContent), sheet=document.querySelector('#sheet'), search=document.querySelector('#search'), km=document.querySelector('#km'), filters=document.querySelector('#filters'), table=document.querySelector('#table');
for(const key of Object.keys(data)) sheet.add(new Option(key,key));
function refresh(){
 const rows=data[sheet.value], fields=Object.keys(rows[0]); filters.replaceChildren();
 km.disabled=!fields.includes('km_inicial');
 for(const name of ['ano','trecho','contrato','empresa','fiscal','tipo','natureza','confianca','funcao','escopo'].filter(x=>fields.includes(x))){
  const label=document.createElement('label'), sel=document.createElement('select');
  label.append(name+' ',sel); sel.dataset.field=name; sel.add(new Option('Todos',''));
  for(const val of [...new Set(rows.map(r=>r[name]).filter(x=>x!=null&&x!==''))].sort()) sel.add(new Option(val,val));
  sel.onchange=render; filters.append(label);
 }render();
}
function render(){
 const rows=data[sheet.value], fields=Object.keys(rows[0]), q=search.value.toLocaleLowerCase('pt-BR'), filter=[...filters.querySelectorAll('select')];
 const visible=rows.filter(r=>Object.values(r).join(' ').toLocaleLowerCase('pt-BR').includes(q)&&filter.every(s=>!s.value||String(r[s.dataset.field])===s.value)&&(km.disabled||!km.value||(r.km_inicial!=null&&+km.value>=r.km_inicial&&+km.value<r.km_final)));
 document.querySelector('#count').textContent=visible.length+' de '+rows.length+' registros';
 table.replaceChildren();
 function row(values,tag){
  const tr=document.createElement('tr');
  for(const val of values){const td=document.createElement(tag); if(typeof val==='string'&&val.startsWith('https://')){const a=document.createElement('a');a.href=val;a.textContent='Abrir fonte';td.append(a)}else td.textContent=val??'—';tr.append(td)}return tr;
 }
 table.createTHead().append(row(fields,'th'));
 const tbody=table.createTBody(); for(const r of visible) tbody.append(row(fields.map(k=>r[k]),'td'));
}
sheet.onchange=refresh;search.oninput=render;km.oninput=render;refresh();
</script></html>
